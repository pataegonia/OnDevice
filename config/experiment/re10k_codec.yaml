# @package _global_
#
# Fine-tunes the released MVSplat re10k checkpoint with the feature codec enabled.
#
# Every architecture setting below is copied verbatim from re10k.yaml and must stay
# that way: src.main drops checkpoint keys whose shape no longer matches (and prints
# them), so changing sh_degree or any depth_unet_* value here would quietly leave
# those layers of checkpoints/re10k.ckpt at their fresh init instead of failing.
#
# codec_cut is left at the costvolume.yaml default (pre_unet). For the post_unet cut
# pass model.encoder.codec_cut=post_unet (scripts/train_codec.slurm: CODEC_CUT=post_unet);
# only to_gaussians.0 is then re-initialised, since its input shrinks to refine_out.

defaults:
  - override /dataset: re10k
  - override /model/encoder: costvolume
  - override /loss: [mse, lpips]

wandb:
  name: re10k_codec
  tags: [re10k, 256x256, codec]

# The reference uses LambdaLR: linear warmup, then flat (its lr_milestones is null).
# cosine_lr=false gives the same shape here; cosine_lr=true would decay instead.
optimizer:
  cosine_lr: false

# batch_size is per GPU, so the effective batch is
#     batch_size * num_gpus * accumulate_grad_batches.
# The baseline used 14 on one 80GB A100 (~5.7GB/sample); the codec adds roughly 1.1GB
# per sample on top (V=2 tensors of [133, 256, 256] through g_a/g_s/AuxT), so budget
# ~6.8GB/sample and expect 2-3 to fit in 24GB. 2 x 8 GPUs x 1 = 16 ~= the baseline 14.
# If this OOMs, halve batch_size and double accumulate_grad_batches.
data_loader:
  train:
    batch_size: 2

trainer:
  # The reference recipe fixes the sample budget rather than the step count. max_steps
  # counts optimizer steps, so accumulation belongs in the divisor:
  #     max_steps = 4_200_000 / (num_gpus * batch_size * accumulate_grad_batches)
  # 4.2M = 14 x 300k, the uncompressed baseline's budget. The value below assumes
  # 8 GPUs x 2 x 4 = 64 per step; scripts/train_codec.slurm recomputes it for you.
  # Sanity check: the reference codec stage ran 4 x 4 x 4 = 64 per step for ~60k steps.
  max_steps: 65_625
  accumulate_grad_batches: 4
  val_check_interval: 0.17
  num_sanity_val_steps: 0

model:
  encoder:
    use_gauss_feature_compression: true
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]

# The reference does not use a single lmbda: each point of the R-D curve is its own
# run, over the ladder 0.0256 / 0.1024 / 0.4096 / 1.6384 (x4 each step). That ladder
# was tuned at sh_degree 3, where the rate_loss denominator is 3*16 + 11 = 59; this
# run is sh_degree 4, i.e. 86, so every rung is scaled by 86/59 = 1.458:
#     0.0256 -> 0.0373    0.4096 -> 0.5970
#     0.1024 -> 0.1493    1.6384 -> 2.3880
# Sweep these with train.lmbda=... on the command line. The default below is the
# gentlest rung, which perturbs the pretrained model least on a first run.
train:
  lmbda: 0.0373
  # Several codec runs (A, B and C cuts alike) hit a single batch with loss in the
  # hundreds around step 7k-12k and then collapsed to a constant render (loss ~0.38).
  # Normal batch losses stay below ~0.2 after warm-up, so skip anything above 1.
  skip_loss_above: 1.0

# lpips loss
loss:
  lpips:
    apply_after_step: 0
    weight: 0.05

dataset:
  image_shape: [256, 256]  # must stay a multiple of 64; g_a is /16 and h_a another /4
  roots: [datasets/re10k]
  near: 1.
  far: 100.
  baseline_scale_bounds: false
  make_baseline_1: false

test:
  eval_time_skip_steps: 5
  compute_scores: true
  compress: true  # measure the real bitstream, not the estimated rate
