name: costvolume

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_depth_candidates: 32
num_surfaces: 1

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

# params for multi-view depth predictor
unimatch_weights_path: "checkpoints/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth"
multiview_trans_attn_split: 2
costvolume_unet_feat_dim: 128
costvolume_unet_channel_mult: [1,1,1]
costvolume_unet_attn_res: []
depth_unet_feat_dim: 64
depth_unet_attn_res: []
depth_unet_channel_mult: [1, 1, 1]
downscale_factor: 4
shim_patch_size: 4

# below are ablation settings, keep them as false for default model
wo_depth_refine: false         # Table 3: base
wo_cost_volume: false          # Table 3: w/o cost volume
wo_backbone_cross_attn: false  # Table 3: w/o cross-view attention
wo_cost_volume_refine: false   # Table 3: w/o U-Net
use_epipolar_trans: false      # Table B: w/ Epipolar Transformer

# Mean-scale hyperprior codec on the full-resolution features (NFC-GS)
use_gauss_feature_compression: false
# Where the depth predictor is cut for the codec:
#   pre_unet  - before the depth refinement U-Net; proj_feat ‖ RGB ‖ disp ‖ conf (128+5 ch)
#   post_unet - after it; refine_out ‖ disp (depth_unet_feat_dim+1 ch). to_gaussians then
#               sees refine_out only, so that head cannot reuse pretrained weights.
#   post_unet_skip - after it, with the head's skip inputs sent too:
#               refine_out ‖ RGB ‖ proj_feat ‖ disp (depth_unet_feat_dim+3+128+1 ch).
#               Original head, all pretrained weights load.
codec_cut: pre_unet
# Cap on the gain of each IGDN layer in the codec's synthesis transform (null = original,
# uncapped). The three IGDNs in g_s amplified a modest latent drift ~1e7x and blew up
# training at 6k-12k steps; healthy layers run at a gain of roughly 1-3. Write it as a
# float (10.0, not 10): the typed config loader rejects an int here.
codec_igdn_max_gain: null
